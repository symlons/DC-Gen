[project]
name = "dc-gen"
version = "0.1.0"
dependencies = [
    "torch",
    "torchvision",
    "torchmetrics",
    "numpy",
    "timm",
    "einops",
    "opencv-python",
    "tqdm",
    "torchprofile",
    "scipy",
    "torch-fidelity",
    "diffusers[torch]",
    "omegaconf",
    "ipdb",
    "wandb[media]",
    "ray",
    "torchdiffeq",
    "imageio[ffmpeg]",
    "huggingface-hub",
    "transformers",
    "onnx",
    "onnxsim",
    "onnxruntime",
    "nibabel",
    "h5py",
    "matplotlib",
    "monai",
    "lpips",
    "triton>=3.6.0",
    "pandas>=3.0.2",
]

[tool.black]
line-length = 120
include = '\.pyi?$'
extend-exclude = ".vscode/.*"

[tool.isort]
profile = "black"
extend_skip = [".vscode", "coco", "assets/data"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.pyright]
exclude = [
    "exp*",
    "assets",
    "wandb",
    "tmp*",
    "dc_gen/c2icore/diffusioncore/efficiency/onnx",
    "dc_gen/c2icore/diffusioncore/efficiency/training_efficiency",
    "dc_gen/c2icore/diffusioncore/efficiency/*.json"
]

[tool.uv.sources]
dc-gen = { workspace = true }

[dependency-groups]
dev = [
    "dc-gen",
]
