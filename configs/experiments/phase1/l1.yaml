dims: "3d"

experiment:
  name: "l1"

paths:
  save_dir: "/cluster/home/kostfab1/DC-Gen/l1_grad"
  checkpoint_dir: "/cluster/home/kostfab1/DC-GEN/checkpoints/l1_grad"

training:
  batch_size: 6

pipeline:
    resize_hw: [256, 256]
    normalize_input_range: [-1000, 1000]

hparams:
  learning_rate: 2e-5

objective:
  ssim_weight: 0.3
  grad_weight: 0.2
  gan_weight: 0.0

logging:
  wandb: True
  wandb_resume_run: True
  save_volumes: True
  viz_every: 1000
  validate_every: 1000
  print_model_arch: False
