dims: "3d"

experiment:
  name: "l2"

paths:
  save_dir: "/cluster/home/kostfab1/DC-Gen/l2"
  checkpoint_dir: "/cluster/home/kostfab1/DC-GEN/checkpoints/l2"

training:
  batch_size: 6

pipeline:
    resize_hw: [256, 256]
    normalize_input_range: [-1000, 1000]

hparams:
  learning_rate: 2e-5

objective:
  loss_fn: "mse"
  ssim_weight: 0.3
  gan_weight: 0.0
  grad_weight: 0.5

logging:
  wandb: True
  wandb_resume_run: True
  save_volumes: True
  viz_every: 5000
  validate_every: 10000
  print_model_arch: False

