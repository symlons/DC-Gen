  sigma: 1.0
  beta_a: 1.0
  beta_b: 1.0
  latent_mean: 0.0
  latent_std: 1.0

training:
  num_epochs: 3500
  batch_size: 512
  shuffle_data: true
  drop_last: true
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  prefetch_factor: null
  dtype: "float32"
  autocast_dtype: "bfloat16"
