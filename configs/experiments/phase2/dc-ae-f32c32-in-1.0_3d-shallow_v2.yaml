dims: "3d"

experiment:
  name: "shallow-v4-experiment"

model:
  name: "dc-ae-f32c32-in-1.0_3d-shallow"
  compile: True

paths:
  save_dir: "/cluster/home/kostfab1/DC-Gen/dc_ae_3d_v04_shallow_phase2_v2"
  checkpoint_dir: "/cluster/home/kostfab1/DC-GEN/checkpoints/checkpoints_v04_shallow_phase2_v2"

training:
  batch_size: 2
  num_workers: 32
  trainable_ae_params:
    - ["encoder.project_out.*", "decoder.project_in.*"]

pipeline:
    resize_hw: [512, 512]

hparams:
  learning_rate: 1e-5
  weight_decay: 1e-3

logging:
  wandb: True
  wandb_resume_run: True
  save_volumes: True
  viz_every: 1000
  validate_every: 5000
