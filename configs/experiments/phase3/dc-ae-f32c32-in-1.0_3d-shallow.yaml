dims: "3d"

experiment:
  name: "shallow-v4-experiment"

model:
  name: "dc-ae-f32c32-in-1.0_3d-shallow"

paths:
  save_dir: "/cluster/home/kostfab1/DC-Gen/dc_ae_3d_v04_shallow_phase3"
  checkpoint_dir: "/cluster/home/kostfab1/DC-GEN/checkpoints/checkpoints_v04_shallow_phase3"

training:
  batch_size: 2
  load_optimizer_state: false
  trainable_ae_params:
    - ["decoder.*"]

objective:
  gan_enable: true
  gan_weight: 0.6
  gan_loss_type: hinge
  gan_patch_size: [64, 64, 16]
  gan_discriminator_steps: 4

pipeline:
    resize_hw: [256, 256]

hparams:
  learning_rate: 1e-6
  discriminator_learning_rate: 4e-6

logging:
  wandb: False
  wandb_resume_run: True
  save_volumes: True
  viz_every: 1000
  validate_every: 2500
